<span class="font-mono font-black text-base tabular-nums text-slate-900 dark:text-white tracking-tighter mt-1" id="digital-clock">

            <div class="flex items-center gap-1.5 bg-slate-100/50 dark:bg-slate-900/50 p-1 rounded-xl border border-slate-200 dark:border-slate-800">

                    </div>
                    <div class="hidden xl:flex flex-col items-start leading-tight text-left">

                    </div>
                </button>

                            <p class="text-[12px] font-black text-white">Daily Reports</p>
                            <p class="text-[9px] text-slate-300 font-bold uppercase tracking-tighter">Activity logs</p>

            <div class="hidden md:block h-10 w-px bg-slate-800 mx-2"></div>
        
            <a href="#" class="relative flex items-center justify-center w-12 h-12 md:w-14 md:h-14 rounded-2xl bg-slate-800 text-white hover:bg-emerald-500 transition-all duration-500 group shadow-sm shrink-0 border border-slate-700">

                <i class="fa-solid fa-bell text-sm"></i>

</header>
<script>
    // Clock Function
    function updateClock() {
        const now = new Date();
        const clockEl = document.getElementById('digital-clock');
        const dateEl = document.getElementById('current-date');
        
        if(clockEl) clockEl.innerText = now.toLocaleTimeString();
        if(dateEl) {
            dateEl.innerText = now.toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Full Screen Toggle
    function toggleFullScreen() {
        const fsIcon = document.getElementById('fullscreen-icon');
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
            if(fsIcon) fsIcon.className = 'fa-solid fa-compress text-slate-500';
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
                if(fsIcon) fsIcon.className = 'fa-solid fa-expand text-slate-500';
            }
        }
    }

    // Dropdown Toggle
    function toggleUserMenu() {
        const userMenu = document.getElementById('user-menu');
        if(userMenu) {
            userMenu.classList.toggle('opacity-0');
            userMenu.classList.toggle('invisible');
            userMenu.classList.toggle('translate-y-4');
        }
    }
    
    // Click Away
    window.onclick = (e) => {
        const userMenu = document.getElementById('user-menu');
        if (userMenu && !e.target.closest('.relative')) {
            userMenu.classList.add('opacity-0', 'invisible', 'translate-y-4');
        }
    }
</script>
