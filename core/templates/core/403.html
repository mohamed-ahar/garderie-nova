<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>403 Forbidden</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-950 text-gray-100 flex items-center justify-center">
  <div class="text-center max-w-md px-6">
    <div class="text-8xl font-extrabold text-red-500 mb-6" id="code">403</div>
    <h1 class="text-2xl font-semibold mb-2">Access Forbidden</h1>
    <p class="text-gray-400 mb-8">
      You do not have permission to access this resource.
    </p>
    <a
      href="/"
      class="inline-block px-6 py-3 rounded-lg bg-gray-800 hover:bg-gray-700 transition-colors"
    >
      Return Home
    </a>
  </div>

  <script>
    const code = document.getElementById("code");
    let visible = true;
    setInterval(() => {
      visible = !visible;
      code.style.opacity = visible ? "1" : "0.3";
    }, 600);
  </script>
</body>
</html>
