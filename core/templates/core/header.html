<header class="sticky top-0 z-40 w-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800/60">

    <div class="flex items-center justify-between px-6 md:px-10 py-3 border-b border-slate-100 dark:border-slate-800/40">

        <div class="flex items-center gap-6">
             <button onclick="toggleSidebar()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                <i class="fa-solid fa-bars"></i>
             </button>

            <div class="hidden md:flex flex-col relative">
                <div class="flex ml-16 items-center gap-2 mb-0.5">
                    <div class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]"></span>
                    </div>
                    <span id="current-date" class=" text-[9px] font-black uppercase tracking-[0.2em] text-emerald-700/70 dark:text-emerald-400/80 ">
                        <!-- Date set by JS -->
                    </span>
                </div>
                <div class="flex ml-16 items-center gap-4 group/header">
                    <div class="flex flex-col">
                        <h2 class="text-2xl font-black text-slate-800 dark:text-slate-100 tracking-tighter leading-none flex items-center gap-2">
                            <span class="relative">
                                Main
                                <span class="absolute -bottom-1.5 left-0 w-0 h-[3px] bg-slate-800 dark:bg-slate-200 rounded-full transition-all duration-500 group-hover/header:w-full"></span>
                            </span>
                            <span class="bg-gradient-to-r from-slate-900 via-slate-600 to-slate-400 dark:from-white dark:via-slate-300 dark:to-slate-500 bg-clip-text text-transparent drop-shadow-sm">
                                Dashboard
                            </span>
                        </h2>
                        
                        <p class="text-[9px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-[0.25em] mt-2 ml-0.5">
                            GarderieNova Management System
                        </p>
                    </div>
                
                    <div class="flex items-center gap-2 px-3 py-1.5 bg-slate-100/80 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700 rounded-xl transition-all duration-300 hover:bg-slate-200 dark:hover:bg-slate-700/60">
                        <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-slate-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-slate-500 dark:bg-slate-400"></span>
                        </span>
                        <span class="text-[10px] font-black text-slate-600 dark:text-slate-300 tracking-tighter uppercase">
                            v1.0.0
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-4">

        <div class="hidden xl:flex items-center gap-4 px-5 py-2 rounded-2xl bg-white/50 dark:bg-slate-900/40 backdrop-blur-md border border-slate-200/60 dark:border-emerald-500/10 shadow-[0_4px_15px_rgba(0,0,0,0.05)] group/clock transition-all hover:border-emerald-500/30" id="clock-container">

<div class="relative flex items-center justify-center w-2 h-2">
    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-40"></span>
    <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500"></span>
</div>

<div class="flex flex-col items-start border-l border-slate-200 dark:border-white/10 pl-3">
    <div class="flex items-center gap-2">
        <span class="text-[9px] font-black text-slate-500 dark:text-emerald-400/80 uppercase tracking-[0.2em] leading-none">
            Live Terminal
        </span>
        <span class="text-[7px] font-bold px-1 rounded bg-slate-200 dark:bg-emerald-500/20 text-slate-600 dark:text-emerald-300 border border-transparent dark:border-emerald-500/20">
            AST
        </span>
    </div>
    
    <span class="font-mono font-black text-base tabular-nums text-slate-900 dark:text-white tracking-tighter mt-1" id="digital-clock">
        <!-- Time set by JS -->
    </span>
</div>
</div>
            <div class="flex items-center gap-1.5 bg-slate-100/50 dark:bg-slate-900/50 p-1 rounded-xl border border-slate-200 dark:border-slate-800">
                <button onclick="toggleFullScreen()" class="p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:text-emerald-500 transition-all active:scale-90 group shadow-sm">
                    <i id="fullscreen-icon" class="fa-solid fa-expand text-slate-500 text-xs"></i>
                </button>
                <button onclick="toggleTheme()" class="p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:text-emerald-500 transition-all active:scale-90 group shadow-sm">
                    <i id="theme-icon" class="fa-solid fa-moon text-slate-500 text-xs"></i>
                </button>
            </div>

            <div class="relative">
                <button onclick="toggleUserMenu()" class="flex items-center gap-3 p-1 pr-3 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-emerald-500/50 transition-all shadow-sm group">
                    <div class="relative">
                        <img src="{% if user.profile_photo %}{{ user.profile_photo.url }}{% else %}https://img.icons8.com/?size=100&id=11781&format=png&color=40C057{% endif %}" class="w-8 h-8 rounded-xl bg-emerald-50 p-0.5 object-cover">
                        <div class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-emerald-500 border-2 border-white dark:border-slate-800 rounded-full"></div>
                    </div>
                    <div class="hidden sm:block text-left">
                        <p class="text-[11px] font-bold text-slate-800 dark:text-slate-100 leading-tight">{{ user.full_name|default:"User" }}</p>
                        <p class="text-[9px] text-emerald-600 dark:text-emerald-400 font-medium uppercase tracking-tighter">{{ user.get_role_type_display|default:"Role" }}</p>
                    </div>
                    <i class="fa-solid fa-chevron-down text-[8px] text-slate-400 group-hover:translate-y-0.5 transition-transform"></i>
                </button>

                <div id="user-menu" class="absolute right-0 mt-3 w-64 bg-white dark:bg-slate-900 rounded-[1.5rem] border border-slate-200 dark:border-emerald-500/20 shadow-2xl opacity-0 invisible translate-y-4 z-50 overflow-hidden transition-all duration-300">
                    <div class="p-5 bg-gradient-to-br from-slate-50 to-white dark:from-emerald-950/20 dark:to-slate-900 border-b border-slate-100 dark:border-slate-800">
                        <p class="text-sm font-black text-slate-800 dark:text-white">{{ user.full_name }}</p>
                        <p class="text-xs text-slate-500 dark:text-emerald-400/60">{{ user.email }}</p>
                    </div>
                    <div class="p-2.5">
                        <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-emerald-50 dark:hover:bg-emerald-500/10 hover:text-emerald-600 dark:hover:text-emerald-400 rounded-xl transition-colors group">
                            <i class="fa-solid fa-user-circle text-lg opacity-40 group-hover:opacity-100"></i> Profile
                        </a>
                        <div class="my-2 border-t border-slate-100 dark:border-slate-800"></div>
                        <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-xl transition-colors">
                            <i class="fa-solid fa-power-off"></i> Sign Out
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Secondary Nav (hidden for now or add if needed) -->
</header>
