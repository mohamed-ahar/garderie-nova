<header class="sticky top-0 z-40 w-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800/60">

    <div class="flex items-center justify-between px-6 md:px-10 py-3 border-b border-slate-100 dark:border-slate-800/40">

        <div class="flex items-center gap-6">
             <button onclick="toggleSidebar()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                <i class="fa-solid fa-bars"></i>
             </button>

            <div class="hidden md:flex flex-col relative">
                <div class="flex ml-16 items-center gap-2 mb-0.5">
                    <div class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]"></span>
                    </div>
                    <span id="current-date" class=" text-[9px] font-black uppercase tracking-[0.2em] text-emerald-700/70 dark:text-emerald-400/80 ">
                        <!-- Date set by JS -->
                    </span>
                </div>
                <div class="flex ml-16 items-center gap-4 group/header">
                    <div class="flex flex-col">
                        <h2 class="text-2xl font-black text-slate-800 dark:text-slate-100 tracking-tighter leading-none flex items-center gap-2">
                            <span class="relative">
                                Main
                                <span class="absolute -bottom-1.5 left-0 w-0 h-[3px] bg-slate-800 dark:bg-slate-200 rounded-full transition-all duration-500 group-hover/header:w-full"></span>
                            </span>
                            <span class="bg-gradient-to-r from-slate-900 via-slate-600 to-slate-400 dark:from-white dark:via-slate-300 dark:to-slate-500 bg-clip-text text-transparent drop-shadow-sm">
                                Dashboard
                            </span>
                        </h2>
                        
                        <p class="text-[9px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-[0.25em] mt-2 ml-0.5">
                            GarderieNova Management System
                        </p>
                    </div>
                
                    <div class="flex items-center gap-2 px-3 py-1.5 bg-slate-100/80 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700 rounded-xl transition-all duration-300 hover:bg-slate-200 dark:hover:bg-slate-700/60">
                        <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-slate-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-slate-500 dark:bg-slate-400"></span>
                        </span>
                        <span class="text-[10px] font-black text-slate-600 dark:text-slate-300 tracking-tighter uppercase">
                            v1.0.0
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-4">

            <!-- Notifications -->
            <div x-data="notificationSystem()" x-init="init()" class="relative">
                <button @click="toggle()" class="relative p-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 hover:text-emerald-500 hover:border-emerald-500/30 transition-all shadow-sm group">
                    <i class="fa-solid fa-bell text-xs"></i>
                    <span x-show="unreadCount > 0" x-text="unreadCount" class="absolute -top-1 -right-1 flex items-center justify-center min-w-[16px] h-4 px-1 bg-rose-500 text-white text-[9px] font-bold rounded-full shadow-sm animate-pulse">
                    </span>
                </button>

                <div x-show="open" 
                     @click.away="open = false"
                     x-transition:enter="transition ease-out duration-200"
                     x-transition:enter-start="opacity-0 translate-y-2"
                     x-transition:enter-end="opacity-100 translate-y-0"
                     x-transition:leave="transition ease-in duration-150"
                     x-transition:leave-start="opacity-100 translate-y-0"
                     x-transition:leave-end="opacity-0 translate-y-2"
                     class="absolute right-0 mt-3 w-80 bg-white dark:bg-slate-900 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 shadow-2xl z-50 overflow-hidden"
                     style="display: none;">
                    
                    <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/20">
                        <h3 class="text-sm font-black text-slate-800 dark:text-white">Notifications</h3>
                        <span x-text="unreadCount + ' New'" class="text-[10px] font-bold text-emerald-500 bg-emerald-50 dark:bg-emerald-500/10 px-2 py-1 rounded-lg uppercase"></span>
                    </div>

                    <div class="max-h-[300px] overflow-y-auto custom-scrollbar">
                        <template x-if="notifications.length === 0">
                            <div class="p-8 text-center">
                                <div class="w-10 h-10 mx-auto bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-400 mb-2">
                                    <i class="fa-regular fa-bell-slash"></i>
                                </div>
                                <p class="text-xs font-medium text-slate-500">No new notifications</p>
                            </div>
                        </template>

                        <template x-for="notif in notifications" :key="notif.id">
                            <div class="p-4 border-b border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors group cursor-pointer"
                                 :class="{'bg-blue-50/30 dark:bg-blue-900/10': !notif.is_read}"
                                 @click="handleNotificationClick(notif)">
                                <div class="flex gap-3">
                                    <div class="flex-shrink-0 mt-1">
                                        <div class="w-2 h-2 rounded-full" :class="notif.is_read ? 'bg-slate-300' : 'bg-blue-500'"></div>
                                    </div>
                                    <div class="flex-1">
                                        <p class="text-xs font-bold text-slate-800 dark:text-slate-200 mb-0.5" x-text="notif.title"></p>
                                        <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-snug" x-text="notif.message"></p>
                                        <p class="text-[9px] font-bold text-slate-400 mt-2 uppercase tracking-wide" x-text="notif.created_at"></p>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                    
                    <div class="p-3 bg-slate-50 dark:bg-slate-800/20 text-center border-t border-slate-100 dark:border-slate-800">
                        <a href="#" class="text-[10px] font-bold text-emerald-500 hover:text-emerald-600 uppercase tracking-widest">View All Activity</a>
                    </div>
                </div>
            </div>

            <script src="//unpkg.com/alpinejs" defer></script>
            <script>
                function notificationSystem() {
                    return {
                        open: false,
                        unreadCount: 0,
                        notifications: [],
                        
                        init() {
                            this.fetchNotifications();
                            // Poll every 30 seconds
                            setInterval(() => {
                                this.fetchNotifications();
                            }, 30000);
                        },

                        toggle() {
                            this.open = !this.open;
                            if (this.open) {
                                this.fetchNotifications();
                            }
                        },

                        fetchNotifications() {
                            fetch('/api/notifications/')
                                .then(response => response.json())
                                .then(data => {
                                    this.unreadCount = data.count;
                                    this.notifications = data.notifications;
                                })
                                .catch(error => console.error('Error fetching notifications:', error));
                        },

                        handleNotificationClick(notif) {
                            this.markRead(notif.id);
                            if (notif.action_url) {
                                window.location.href = notif.action_url;
                            }
                        },

                        markRead(id) {
                            // Optimistic update
                            const notif = this.notifications.find(n => n.id === id);
                            if (notif && !notif.is_read) {
                                notif.is_read = true;
                                this.unreadCount = Math.max(0, this.unreadCount - 1);
                                
                                fetch(`/api/notifications/${id}/read/`, {
                                    method: 'POST',
                                    headers: {
                                        'X-CSRFToken': getCookie('csrftoken'),
                                        'Content-Type': 'application/json'
                                    }
                                });
                            }
                        }
                    }
                }

                // Helper to get CSRF token
                function getCookie(name) {
                    let cookieValue = null;
                    if (document.cookie && document.cookie !== '') {
                        const cookies = document.cookie.split(';');
                        for (let i = 0; i < cookies.length; i++) {
                            const cookie = cookies[i].trim();
                            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                                break;
                            }
                        }
                    }
                    return cookieValue;
                }
            </script>

        <div class="hidden xl:flex items-center gap-4 px-5 py-2 rounded-2xl bg-white/50 dark:bg-slate-900/40 backdrop-blur-md border border-slate-200/60 dark:border-emerald-500/10 shadow-[0_4px_15px_rgba(0,0,0,0.05)] group/clock transition-all hover:border-emerald-500/30" id="clock-container">

<div class="relative flex items-center justify-center w-2 h-2">
    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-40"></span>
    <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500"></span>
</div>

<div class="flex flex-col items-start border-l border-slate-200 dark:border-white/10 pl-3">
    <div class="flex items-center gap-2">
        <span class="text-[9px] font-black text-slate-500 dark:text-emerald-400/80 uppercase tracking-[0.2em] leading-none">
            Live Terminal
        </span>
        <span class="text-[7px] font-bold px-1 rounded bg-slate-200 dark:bg-emerald-500/20 text-slate-600 dark:text-emerald-300 border border-transparent dark:border-emerald-500/20">
            AST
        </span>
    </div>
    
    <span class="font-mono font-black text-base tabular-nums text-slate-900 dark:text-white tracking-tighter mt-1" id="digital-clock">
        <!-- Time set by JS -->
    </span>
</div>
</div>
            <div class="flex items-center gap-1.5 bg-slate-100/50 dark:bg-slate-900/50 p-1 rounded-xl border border-slate-200 dark:border-slate-800">
                <button onclick="toggleFullScreen()" class="p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:text-emerald-500 transition-all active:scale-90 group shadow-sm">
                    <i id="fullscreen-icon" class="fa-solid fa-expand text-slate-500 text-xs"></i>
                </button>
                <button onclick="toggleTheme()" class="p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:text-emerald-500 transition-all active:scale-90 group shadow-sm">
                    <i id="theme-icon" class="fa-solid fa-moon text-slate-500 text-xs"></i>
                </button>
            </div>

            <div class="relative">
                <button onclick="toggleUserMenu()" class="flex items-center gap-3 p-1 pr-3 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-emerald-500/50 transition-all shadow-sm group">
                    <div class="relative">
                        {% if user.profile_photo %}
                        <img src="{{ user.profile_photo.url }}" class="w-8 h-8 rounded-xl bg-emerald-50 p-0.5 object-cover">
                        {% else %}
                        <div class="w-8 h-8 rounded-xl bg-emerald-100 dark:bg-emerald-900/50 flex items-center justify-center text-emerald-600 dark:text-emerald-400 font-black text-xs border border-emerald-200 dark:border-emerald-800">
                            {{ user.full_name|slice:":1"|upper }}
                        </div>
                        {% endif %}
                        <div class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-emerald-500 border-2 border-white dark:border-slate-800 rounded-full"></div>
                    </div>
                    <div class="hidden sm:block text-left">
                        <p class="text-[11px] font-bold text-slate-800 dark:text-slate-100 leading-tight">{{ user.full_name|default:"User" }}</p>
                        <p class="text-[9px] text-emerald-600 dark:text-emerald-400 font-medium uppercase tracking-tighter">{{ user.get_role_type_display|default:"Role" }}</p>
                    </div>
                    <i class="fa-solid fa-chevron-down text-[8px] text-slate-400 group-hover:translate-y-0.5 transition-transform"></i>
                </button>

                <div id="user-menu" class="absolute right-0 mt-3 w-64 bg-white dark:bg-slate-900 rounded-[1.5rem] border border-slate-200 dark:border-emerald-500/20 shadow-2xl opacity-0 invisible translate-y-4 z-50 overflow-hidden transition-all duration-300">
                    <div class="p-5 bg-gradient-to-br from-slate-50 to-white dark:from-emerald-950/20 dark:to-slate-900 border-b border-slate-100 dark:border-slate-800">
                        <p class="text-sm font-black text-slate-800 dark:text-white">{{ user.full_name }}</p>
                        <p class="text-xs text-slate-500 dark:text-emerald-400/60">{{ user.email }}</p>
                    </div>
                    <div class="p-2.5">
                        <a href="{% url 'personal_profile' %}" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-emerald-50 dark:hover:bg-emerald-500/10 hover:text-emerald-600 dark:hover:text-emerald-400 rounded-xl transition-colors group">
                            <i class="fa-solid fa-user-circle text-lg opacity-40 group-hover:opacity-100"></i> Personal Profile
                        </a>
                        <div class="my-2 border-t border-slate-100 dark:border-slate-800"></div>
                        <form action="{% url 'logout' %}" method="post">
                            {% csrf_token %}
                            <button type="submit" class="flex w-full items-center gap-3 px-4 py-3 text-sm font-bold text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-xl transition-colors">
                                <i class="fa-solid fa-power-off"></i> Sign Out
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Secondary Nav (hidden for now or add if needed) -->
</header>
