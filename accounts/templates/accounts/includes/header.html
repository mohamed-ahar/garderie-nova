<header class="sticky top-0 z-40 w-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800/60">

    <div class="flex items-center justify-between px-6 md:px-10 py-3 border-b border-slate-100 dark:border-slate-800/40">

        <div class="flex items-center gap-6">
            <button onclick="toggleSidebar()" 
            class="group relative p-2.5 rounded-xl border transition-all duration-300 shadow-sm backdrop-blur-md
            bg-white dark:bg-slate-900/50 
            {% if user.role_type == 'director' %} 
                border-slate-200 dark:border-emerald-500/20 text-emerald-600 dark:text-emerald-400 hover:shadow-emerald-500/10 hover:border-emerald-500/40
            {% elif user.role_type == 'parent' %} 
                border-slate-200 dark:border-rose-500/20 text-rose-600 dark:text-rose-400 hover:shadow-rose-500/10 hover:border-rose-500/40
            {% else %} 
                border-slate-200 dark:border-indigo-500/20 text-indigo-600 dark:text-indigo-400 hover:shadow-indigo-500/10 hover:border-indigo-500/40
            {% endif %}">
        
            <div class="absolute inset-0 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity duration-500
                {% if user.role_type == 'director' %} bg-gradient-to-tr from-emerald-500/10 to-teal-500/5
                {% elif user.role_type == 'parent' %} bg-gradient-to-tr from-rose-500/10 to-orange-500/5
                {% else %} bg-gradient-to-tr from-indigo-500/10 to-purple-500/5 {% endif %}">
            </div>
            
            <div class="relative z-10 flex items-center justify-center">
                <i class="fa-solid fa-bars-staggered text-sm group-hover:scale-110 transition-transform duration-500"></i>
            </div>
        
            <div class="absolute -top-px -left-px w-2 h-2 rounded-tl-lg opacity-0 group-hover:opacity-100 transition-all duration-300
                {% if user.role_type == 'director' %} bg-emerald-500
                {% elif user.role_type == 'parent' %} bg-rose-500
                {% else %} bg-indigo-500 {% endif %}">
            </div>
        </button>
            <div class="hidden md:flex flex-col relative group/container">
                <div class="flex ml-16 items-center gap-3 mb-1">
                    <div class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.8)]"></span>
                    </div>
                    <span id="current-date" class="text-[10px] font-bold uppercase tracking-[0.25em] text-slate-500 dark:text-emerald-400/70 transition-colors duration-300">
                </span>
                </div>


            </div>
        </div>

        <div class="flex items-center gap-4">

            <!-- Notifications -->
            <div x-data="notificationSystem()" x-init="init()" class="relative">
                <button @click="toggle()" 
                class="relative p-2.5 rounded-2xl transition-all duration-300 group overflow-visible
                bg-white dark:bg-slate-900 shadow-[0_1px_3px_rgba(0,0,0,0.1)]
                {% if user.role_type == 'director' %} 
                    text-emerald-600 dark:text-emerald-400 border border-emerald-500/20 bg-emerald-500/[0.02]
                {% elif user.role_type == 'parent' %} 
                    text-rose-600 dark:text-rose-400 border border-rose-500/20 bg-rose-500/[0.02]
                {% else %} 
                    text-indigo-600 dark:text-indigo-400 border border-indigo-500/20 bg-indigo-500/[0.02]
                {% endif %}">
                
                <i class="fa-solid fa-bell text-sm transition-transform duration-300 group-hover:scale-110 group-hover:rotate-12"></i>
            
                <span x-show="unreadCount > 0" 
                    class="absolute -top-1 -right-1 flex items-center justify-center min-w-[18px] h-[18px] px-1.5 
                           text-white text-[10px] font-black rounded-lg shadow-xl z-10
                           ring-[3px] white dark:ring-slate-900 transition-transform duration-300 group-hover:-translate-y-0.5
                    {% if user.role_type == 'director' %} bg-emerald-500 shadow-emerald-500/40
                    {% elif user.role_type == 'parent' %} bg-rose-500 shadow-rose-500/40
                    {% else %} bg-indigo-500 shadow-indigo-500/40 {% endif %}">
                    <span x-text="unreadCount"></span>
                </span>
            
                <div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-0 h-[2px] rounded-full transition-all duration-300 group-hover:w-4
                    {% if user.role_type == 'director' %} bg-emerald-500
                    {% elif user.role_type == 'parent' %} bg-rose-500
                    {% else %} bg-indigo-500 {% endif %}">
                </div>
            </button>

                <div x-show="open" @click.away="open = false" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-150"
                    x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 translate-y-2" class="absolute right-0 mt-3 w-80 bg-white dark:bg-slate-900 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 shadow-2xl z-50 overflow-hidden"
                    style="display: none;">

                    <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/20">
                        <h3 class="text-sm font-black text-slate-800 dark:text-white">Notifications</h3>
                        <span x-text="unreadCount + ' New'" class="text-[10px] font-bold text-emerald-500 bg-emerald-50 dark:bg-emerald-500/10 px-2 py-1 rounded-lg uppercase"></span>
                    </div>

                    <div class="max-h-[300px] overflow-y-auto custom-scrollbar">
                        <template x-if="notifications.length === 0">
                            <div class="p-8 text-center">
                                <div class="w-10 h-10 mx-auto bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-400 mb-2">
                                    <i class="fa-regular fa-bell-slash"></i>
                                </div>
                                <p class="text-xs font-medium text-slate-500">No new notifications</p>
                            </div>
                        </template>

                        <template x-for="notif in notifications" :key="notif.id">
                            <div class="p-4 border-b border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors group cursor-pointer"
                                 :class="{'bg-blue-50/30 dark:bg-blue-900/10': !notif.is_read}"
                                 @click="handleNotificationClick(notif)">
                                <div class="flex gap-3">
                                    <div class="flex-shrink-0 mt-1">
                                        <div class="w-2 h-2 rounded-full" :class="notif.is_read ? 'bg-slate-300' : 'bg-blue-500'"></div>
                                    </div>
                                    <div class="flex-1">
                                        <p class="text-xs font-bold text-slate-800 dark:text-slate-200 mb-0.5" x-text="notif.title"></p>
                                        <p class="text-[11px] text-slate-500 dark:text-slate-400 whitespace-pre-line leading-snug" x-text="notif.message"></p>
                                        <p class="text-[9px] font-bold text-slate-400 mt-2 uppercase tracking-wide" x-text="notif.created_at"></p>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <div class="p-3 bg-slate-50 dark:bg-slate-800/20 text-center border-t border-slate-100 dark:border-slate-800">
                        <a href="#" class="text-[10px] font-bold text-emerald-500 hover:text-emerald-600 uppercase tracking-widest">View All Activity</a>
                    </div>
                </div>
            </div>

            <script src="//unpkg.com/alpinejs" defer></script>
            <script>
                function notificationSystem() {
                    return {
                        open: false,
                        unreadCount: 0,
                        notifications: [],
                        socket: null,

                        init() {
                            this.fetchNotifications();
                            this.connectWebSocket();
                        },

                        connectWebSocket() {
                            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                            const wsUrl = `${protocol}//${window.location.host}/ws/notifications/`;
                            
                            this.socket = new WebSocket(wsUrl);
                            
                            this.socket.onmessage = (e) => {
                                const data = JSON.parse(e.data);
                                if (data.type === 'notification') {
                                    // If we receive a full notification object, add it
                                    if (data.notification && Object.keys(data.notification).length > 0) {
                                        this.notifications.unshift(data.notification);
                                        // Optional: limit list size
                                        if (this.notifications.length > 20) {
                                            this.notifications.pop();
                                        }
                                    }
                                    
                                    // Update count
                                    if (data.unread_count !== undefined) {
                                        this.unreadCount = data.unread_count;
                                    }
                                }
                            };

                            this.socket.onclose = (e) => {
                                console.log('Notification socket closed. Reconnecting...');
                                setTimeout(() => {
                                    this.connectWebSocket();
                                }, 5000);
                            };
                        },

                        toggle() {
                            this.open = !this.open;
                            if (this.open) {
                                this.fetchNotifications();
                            }
                        },

                        fetchNotifications() {
                            fetch('/api/notifications/')
                                .then(response => response.json())
                                .then(data => {
                                    this.unreadCount = data.count;
                                    this.notifications = data.notifications;
                                })
                                .catch(error => console.error('Error fetching notifications:', error));
                        },

                        async handleNotificationClick(notif) {
                            await this.markRead(notif.id);
                            if (notif.action_url) {
                                window.location.href = notif.action_url;
                            }
                        },

                        async markRead(id) {
                            // Optimistic update
                            const notif = this.notifications.find(n => n.id === id);
                            if (notif && !notif.is_read) {
                                notif.is_read = true;
                                this.unreadCount = Math.max(0, this.unreadCount - 1);

                                return fetch(`/api/notifications/${id}/read/`, {
                                    method: 'POST',
                                    headers: {
                                        'X-CSRFToken': getCookie('csrftoken'),
                                        'Content-Type': 'application/json'
                                    }
                                }).catch(error => console.error('Error marking notification as read:', error));
                            }

                            return Promise.resolve();
                        }
                    }
                }

                // Helper to get CSRF token
                function getCookie(name) {
                    let cookieValue = null;
                    if (document.cookie && document.cookie !== '') {
                        const cookies = document.cookie.split(';');
                        for (let i = 0; i < cookies.length; i++) {
                            const cookie = cookies[i].trim();
                            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                                break;
                            }
                        }
                    }
                    return cookieValue;
                }
            </script>

            <div class="hidden xl:flex items-center gap-4 px-5 py-2 rounded-2xl bg-white/50 dark:bg-slate-900/40 backdrop-blur-md border border-slate-200/60 dark:border-emerald-500/10 shadow-[0_4px_15px_rgba(0,0,0,0.05)] group/clock transition-all hover:border-emerald-500/30"
                id="clock-container">

                <div class="relative flex items-center justify-center w-2 h-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-40"></span>
                    <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500"></span>
                </div>

                <div class="flex flex-col items-start border-l border-slate-200 dark:border-white/10 pl-3">
                    <div class="flex items-center gap-2">
                        <span class="text-[9px] font-black text-slate-500 dark:text-emerald-400/80 uppercase tracking-[0.2em] leading-none">
                         Live Terminal
                        </span>
                        <span class="text-[7px] font-bold px-1 rounded bg-slate-200 dark:bg-emerald-500/20 text-slate-600 dark:text-emerald-300 border border-transparent dark:border-emerald-500/20">
                           AST
                           </span>
                </div>

                    <span class="font-mono font-black text-base tabular-nums text-slate-900 dark:text-white tracking-tighter mt-1" id="digital-clock">
        <!-- Time set by JS -->
    </span>
                </div>
            </div>
            <div class="flex items-center gap-1.5 bg-slate-100/50 dark:bg-slate-900/50 p-1 rounded-xl border border-slate-200 dark:border-slate-800">
                <button onclick="toggleFullScreen()" class="p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:text-emerald-500 transition-all active:scale-90 group shadow-sm">
                    <i id="fullscreen-icon" class="fa-solid fa-expand text-slate-500 text-xs"></i>
                </button>
                <button onclick="toggleTheme()" class="p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:text-emerald-500 transition-all active:scale-90 group shadow-sm">
                    <i id="theme-icon" class="fa-solid fa-moon text-slate-500 text-xs"></i>
                </button>
            </div>

            <div class="relative">
                <button onclick="toggleUserMenu()"
                    class="flex items-center gap-3 p-1.5 pr-4 rounded-[1.25rem]
                           bg-white/80 dark:bg-slate-900/80 backdrop-blur-md
                           border transition-all duration-300 group
                           {% if user.role_type == 'director' %} border-emerald-500/20 hover:border-emerald-500/50 hover:shadow-emerald-500/10
                           {% elif user.role_type == 'parent' %} border-rose-500/20 hover:border-rose-500/50 hover:shadow-rose-500/10
                           {% else %} border-indigo-500/20 hover:border-indigo-500/50 hover:shadow-indigo-500/10 {% endif %}">
                    
                    <div class="relative p-0.5 rounded-xl bg-gradient-to-tr from-slate-200 to-white dark:from-slate-700 dark:to-slate-800 shadow-inner">
                        {% if user.profile_photo %}
                            <img src="{{ user.profile_photo.url }}" class="w-9 h-9 rounded-[10px] object-cover border border-white/50 dark:border-slate-600">
                        {% else %}
                            <div class="w-9 h-9 rounded-[10px] flex items-center justify-center text-white font-black text-xs shadow-lg 
                                {% if user.role_type == 'director' %} bg-emerald-500 shadow-emerald-500/20
                                {% elif user.role_type == 'parent' %} bg-rose-500 shadow-rose-500/20
                                {% else %} bg-indigo-500 shadow-indigo-500/20 {% endif %}">
                                {{ user.full_name|slice:":1"|upper }}
                            </div>
                        {% endif %}
                        
                        <span class="absolute -top-1 -right-1 flex h-3 w-3">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75
                                {% if user.role_type == 'director' %} bg-emerald-400
                                {% elif user.role_type == 'parent' %} bg-rose-400
                                {% else %} bg-indigo-400 {% endif %}"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 border-2 border-white dark:border-slate-900
                                {% if user.role_type == 'director' %} bg-emerald-500
                                {% elif user.role_type == 'parent' %} bg-rose-500
                                {% else %} bg-indigo-500 {% endif %}"></span>
                        </span>
                    </div>

                    <div class="hidden sm:block text-left">
                        <p class="text-[12px] font-black text-slate-800 dark:text-slate-100 leading-tight tracking-tight">{{ user.full_name|default:"User" }}</p>
                        <div class="flex items-center gap-1.5">
                            <span class="w-1 h-1 rounded-full 
                                {% if user.role_type == 'director' %} bg-emerald-500
                                {% elif user.role_type == 'parent' %} bg-rose-500
                                {% else %} bg-indigo-500 {% endif %}"></span>
                            <p class="text-[9px] text-slate-500 dark:text-slate-400 font-bold uppercase tracking-widest">{{ user.get_role_type_display|default:"Role" }}</p>
                        </div>
                    </div>
            
                    <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 transition-all duration-300
                        {% if user.role_type == 'director' %} group-hover:text-emerald-500 
                        {% elif user.role_type == 'parent' %} group-hover:text-rose-500 
                        {% else %} group-hover:text-indigo-500 {% endif %}"></i>
                </button>
            
                <div id="user-menu" 
                class="absolute right-0 mt-4 w-72 backdrop-blur-2xl
                       rounded-[2.5rem] border opacity-0 invisible translate-y-4 z-50 overflow-hidden transition-all duration-300
                       shadow-[0_25px_50px_-12px_rgba(0,0,0,0.3)]
                       {% if user.role_type == 'director' %} bg-emerald-950/90 dark:bg-slate-900/95 border-emerald-500/20
                       {% elif user.role_type == 'parent' %} bg-rose-500 dark:bg-slate-900/95 border-rose-500/20
                       {% else %} bg-indigo-950/90 dark:bg-slate-900/95 border-indigo-500/20 {% endif %}">
            
                <div class="relative p-6 pb-4 overflow-hidden">
                    <div class="absolute top-0 right-0 -mr-4 -mt-4 w-32 h-32 rounded-full blur-3xl opacity-50
                        {% if user.role_type == 'director' %} bg-emerald-500/30
                        {% elif user.role_type == 'parent' %} bg-rose-500/30
                        {% else %} bg-indigo-500/30 {% endif %}"></div>
                    
                    <p class="relative z-10 text-base font-black text-white leading-none mb-1">{{ user.full_name }}</p>
                    <p class="relative z-10 text-sm font-medium text-white">{{ user.email }}</p>
                </div>
            
                <div class="px-4 pb-4">
                    <div class="p-2 rounded-[2rem] border transition-colors duration-500
                        {% if user.role_type == 'director' %} bg-emerald-500/[0.05] border-emerald-500/10
                        {% elif user.role_type == 'parent' %} bg-rose-500/[0.05] border-rose-500/10
                        {% else %} bg-indigo-500/[0.05] border-indigo-500/10 {% endif %}">
                        
                        <a href="{% url 'personal_profile' %}" 
                           class="flex items-center justify-between p-3 rounded-2xl transition-all group/item bg-white/10">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-white/70 shadow-sm transition-all
                                    {% if user.role_type == 'director' %} group-hover/item:text-emerald-400 group-hover/item:bg-emerald-500/20
                                    {% elif user.role_type == 'parent' %} group-hover/item:text-rose-400 group-hover/item:bg-rose-500/20
                                    {% else %} group-hover/item:text-indigo-400 group-hover/item:bg-indigo-500/20 {% endif %}">
                                    <i class="fa-solid fa-fingerprint text-lg"></i>
                                </div>
                                <div>
                                    <p class="text-sm font-bold text-white">Account information</p>
                                    <p class="text-[10px] text-white font-medium uppercase tracking-wider">Settings & Security</p>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-[10px] text-white/20 group-hover/item:translate-x-1 group-hover/item:text-white/60 transition-all"></i>
                        </a>
            
                        <div class="h-px w-full opacity-10 my-2
                            {% if user.role_type == 'director' %} bg-emerald-400
                            {% elif user.role_type == 'parent' %} bg-rose-400
                            {% else %} bg-indigo-400 {% endif %}"></div>
            
                    </div>
                </div>
            
        
            </div>
            </div>
        </div>
    </div>

    <!-- Secondary Nav (hidden for now or add if needed) -->
</header>
