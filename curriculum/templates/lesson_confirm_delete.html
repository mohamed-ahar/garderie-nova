{% extends "base.html" %}

{% block content %}
<div class="relative min-h-[80vh] flex items-center justify-center py-12 px-6 overflow-hidden bg-white dark:bg-slate-950">
    <div class="absolute inset-0 pointer-events-none">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-green-500/5 rounded-full blur-[120px]"></div>
    </div>

    <div class="relative z-10 max-w-xl w-full">
        <div class="bg-white dark:bg-slate-900 rounded-[3rem] border border-slate-100 dark:border-slate-800 p-10 shadow-[0_40px_100px_rgba(0,0,0,0.04)] text-center space-y-8">
            
            <div class="relative mx-auto w-24 h-24 flex items-center justify-center">
                <div class="absolute inset-0 bg-green-500/10 animate-ping rounded-full"></div>
                <div class="relative w-20 h-20 bg-green-50 dark:bg-green-500/10 rounded-3xl flex items-center justify-center text-green-500 border border-green-100 dark:border-green-500/20">
                    <i class="fa-solid fa-triangle-exclamation text-3xl"></i>
                </div>
            </div>

            <div class="space-y-3">
                <h2 class="text-[10px] font-black text-green-500 uppercase tracking-[0.4em]">Irreversible Action</h2>
                <h1 class="text-3xl font-black text-slate-900 dark:text-white tracking-tight leading-tight">
                    Confirm Deletion
                </h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm font-medium leading-relaxed italic">
                    "{{ object.title }}"
                </p>
                <p class="text-[11px] text-slate-400 font-bold uppercase tracking-widest pt-4">
                    Are you sure you want to remove this module from the academic database?
                </p>
            </div>

            <form method="post" class="grid grid-cols-2 gap-4 pt-4">
                {% csrf_token %}
                <a href="{% url 'curriculum:lesson_list' %}" class="flex items-center justify-center gap-2 px-6 py-4 rounded-2xl bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-black text-[10px] uppercase tracking-widest hover:bg-slate-100 dark:hover:bg-slate-700 transition-all">
                    Cancel
                </a>
                <button type="submit" class="group flex items-center justify-center gap-3 px-6 py-4 rounded-2xl bg-green-600 text-white font-black text-[10px] uppercase tracking-widest hover:bg-green-700 transition-all shadow-xl shadow-green-500/20 active:scale-95">
                    <span>Delete Asset</span>
                    <i class="fa-solid fa-trash-can group-hover:shake transition-transform"></i>
                </button>
            </form>
        </div>

        <p class="mt-8 text-center text-[9px] font-black text-slate-400 uppercase tracking-[0.3em]">
            System Log: User {{ user.get_full_name }} initiated removal sequence.
        </p>
    </div>
</div>

<style>
    @keyframes shake {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-10deg); }
        75% { transform: rotate(10deg); }
    }
    .group:hover .fa-trash-can {
        animation: shake 0.3s infinite ease-in-out;
    }
</style>
{% endblock %}
