<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>403 | Forbidden</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-slate-800 antialiased h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full text-center">
        <div class="mb-8 flex justify-center">
            <div class="w-16 h-16 bg-white shadow-sm border border-gray-200 rounded-2xl flex items-center justify-center">
                <i class="fa-solid fa-lock text-gray-400 text-xl"></i>
            </div>
        </div>

        <div class="space-y-3">
            <h1 class="text-sm font-bold tracking-[0.2em] uppercase text-indigo-600">Error 403</h1>
            <h2 class="text-3xl font-semibold text-slate-900 tracking-tight">Access is restricted</h2>
            <p class="text-slate-500 leading-relaxed">
                You don't have permission to view this page. Please check your credentials or contact your administrator.
            </p>
        </div>

        <div class="mt-10 flex flex-col gap-3">
            <a href="/" class="inline-flex items-center justify-center px-6 py-3 bg-slate-900 text-white font-medium rounded-lg hover:bg-slate-800 transition-colors">
                Back to Safety
            </a>
            <button onclick="window.history.back()" class="inline-flex items-center justify-center px-6 py-3 bg-white border border-gray-200 text-slate-600 font-medium rounded-lg hover:bg-gray-50 transition-colors">
                Try Again
            </button>
        </div>

        <div class="mt-12 text-sm text-gray-400">
            Need help? <a href="#" class="text-slate-600 hover:underline">Contact Support</a>
        </div>
    </div>

</body>
</html>
