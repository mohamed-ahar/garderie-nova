{% extends 'base.html' %}
{% block title %}Register Child{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-sm">
    <h2 class="text-2xl font-bold mb-6 text-gray-800">Inscrire un enfant (Liste d'attente)</h2>
    
    <form method="POST" class="space-y-6">
        {% csrf_token %}
        
        <!-- Child Name -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nom complet de l'enfant</label>
            <input type="text" name="child_name" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent"
                   placeholder="Ex: Amine Benali">
        </div>

        <!-- Birth Date -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Date de naissance</label>
            <input type="date" name="birth_date" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent">
        </div>

        <!-- Contact Info -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Numéro de téléphone</label>
                <input type="tel" name="contact_phone" required value="{{ request.user.phone_number }}"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Adresse email</label>
                <input type="email" name="contact_email" required value="{{ request.user.email }}"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent">
            </div>
        </div>

        <!-- Center Selection (Hidden if only one, or selectable) -->
        {% if centers.count >= 1 %}
        <div>
             <label class="block text-sm font-medium text-gray-700 mb-1">Choisir une garderie</label>
             <select name="center_id" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                 {% for center in centers %}
                 <option value="{{ center.center_id }}">{{ center.name }}</option>
                 {% endfor %}
             </select>
        </div>
        {% endif %}

        <div class="pt-4">
            <button type="submit" class="w-full bg-teal-600 text-white py-2 px-4 rounded-lg hover:bg-teal-700 transition duration-200 font-medium">
                Inscrire sur la liste d'attente
            </button>
        </div>
    </form>
</div>
{% endblock %}
