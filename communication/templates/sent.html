{% extends "base.html" %}
{% block content %}
<div class="p-8 bg-white dark:bg-slate-950 min-h-screen">
    <div class="max-w-6xl mx-auto">
        <div class="flex items-center justify-between mb-10">
            <div>
                <h1 class="text-3xl font-black text-slate-900 dark:text-white tracking-tighter">Sent Messages</h1>
                <p class="text-slate-400 text-sm font-medium uppercase tracking-widest">Outbox History</p>
            </div>
            <a href="{% url 'communication:inbox' %}" class="bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-300 px-6 py-3 rounded-2xl font-bold text-sm transition-all flex items-center gap-2 hover:bg-slate-200">
                <i class="fa-solid fa-inbox text-[10px]"></i> Back to Inbox
            </a>
        </div>

        <div class="space-y-3">
            {% for msg in messages %}
            <div class="group relative bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 p-5 rounded-[1.5rem] transition-all hover:scale-[1.01] flex items-center gap-6">
                
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white font-black shadow-md">
                    To
                </div>

                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-3">
                        <span class="text-[13px] font-black text-slate-900 dark:text-white">{{ msg.receiver.full_name }}</span>
                        <span class="text-[10px] font-bold text-slate-400 uppercase">Sent</span>
                    </div>
                    <h3 class="text-sm font-bold text-slate-500 dark:text-slate-400 truncate mt-0.5">{{ msg.subject }}</h3>
                </div>

                <div class="text-right flex flex-col items-end gap-1">
                    <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">{{ msg.created_at|date:"d M" }}</span>
                    <span class="text-[9px] font-medium text-slate-400">{{ msg.created_at|time:"H:i" }}</span>
                </div>
            </div>
            {% empty %}
            <div class="text-center py-24 bg-slate-50 dark:bg-slate-900/50 rounded-[3rem] border-2 border-dashed border-slate-100 dark:border-slate-800">
                <i class="fa-solid fa-paper-plane text-5xl text-slate-200 dark:text-slate-800 mb-6"></i>
                <p class="text-slate-400 font-black uppercase tracking-widest text-[10px]">No sent messages</p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
